<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>煎蛋Agent</title>
  </head>
  <body>
    <div id="root">
      <div id="loading" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#1a1a2e;color:#666;font-family:system-ui,sans-serif;gap:16px;">
        <svg width="48" height="48" viewBox="0 0 80 80" fill="none" style="opacity:0.5;animation:pulse 2s ease-in-out infinite;">
          <ellipse cx="40" cy="43" rx="22" ry="28" stroke="currentColor" stroke-width="1.5" />
          <circle cx="31" cy="36" r="3" fill="currentColor" />
          <circle cx="49" cy="36" r="3" fill="currentColor" />
          <path d="M34 47 Q40 53 46 47" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <span style="font-size:14px;">正在启动后端服务...</span>
        <div style="width:16px;height:16px;border:2px solid #444;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <style>
          @keyframes pulse { 0%,100% { opacity:0.3; } 50% { opacity:0.7; } }
          @keyframes spin { to { transform:rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
